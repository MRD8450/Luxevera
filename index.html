<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUXEVERA | Luxury Product Showcase</title>

    <!-- App Icon für iOS / Android Home-Bildschirm & Browser-Favicon -->
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="icon" type="image/png" href="logo.png">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-gradient-start: #e5d9cc;
            --bg-gradient-end: #c4b09c;
            --card-bg: rgba(255, 255, 255, 0.75);
            --text-dark: #2a211c;
            --accent-bronze: #735942;
            --accent-gold: #b39368;
            --accent-gold-bright: #d4af37;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
            color: var(--text-dark);
            min-height: 100vh;
            padding-bottom: 50px;
        }

        /* 1. Stufe: Startseiten-PIN Overlay (2026) */
        #pin-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        /* 2. Stufe: Admin-PIN Modal (8888) */
        #admin-pin-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }

        .pin-box {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: var(--shadow);
            text-align: center;
            max-width: 380px;
            width: 90%;
            position: relative;
        }

        .pin-box h2 {
            font-size: 1.5rem;
            letter-spacing: 2px;
            margin-bottom: 10px;
            color: var(--text-dark);
            text-transform: uppercase;
        }

        .pin-box p {
            font-size: 0.9rem;
            color: var(--accent-bronze);
            margin-bottom: 20px;
        }

        .pin-box input {
            width: 100%;
            padding: 12px;
            font-size: 1.2rem;
            text-align: center;
            letter-spacing: 5px;
            border: 1px solid var(--accent-bronze);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.9);
            color: var(--text-dark);
            margin-bottom: 15px;
            outline: none;
        }

        .pin-box button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-bronze);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .pin-box button:hover {
            background-color: var(--text-dark);
        }

        .close-pin-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: transparent;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--text-dark);
        }

        .pin-error {
            color: #a94442;
            font-size: 0.85rem;
            margin-top: 10px;
            display: none;
        }

        #main-content {
            display: none;
        }

        header {
            text-align: center;
            padding: 40px 20px 20px;
            position: relative;
        }

        .logo-img {
            max-width: 320px;
            width: 100%;
            height: auto;
            margin-bottom: 10px;
        }

        .admin-toggle-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: transparent;
            border: 1px solid var(--accent-bronze);
            color: var(--text-dark);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .admin-toggle-btn:hover {
            background: var(--accent-bronze);
            color: #fff;
        }

        /* Kachel-Raster für Kategorien */
        .category-tiles-container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
        }

        .category-tile {
            position: relative;
            height: 220px;
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .category-tile:hover {
            transform: translateY(-6px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.18);
        }

        .category-tile img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .category-tile:hover img {
            transform: scale(1.08);
        }

        .category-tile-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, rgba(42, 33, 28, 0.85), rgba(0, 0, 0, 0.1));
            display: flex;
            align-items: flex-end;
            padding: 20px;
        }

        .category-tile-title {
            color: #ffffff;
            font-size: 1.3rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
        }

        /* Highlight-Design für Angebote der Woche Kachel */
        .category-tile.offer-tile {
            border: 2px solid var(--accent-gold-bright);
        }

        .category-tile.offer-tile .category-tile-overlay {
            background: linear-gradient(to top, rgba(115, 89, 66, 0.9), rgba(212, 175, 55, 0.3));
        }

        .tile-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: var(--accent-gold-bright);
            color: #2a211c;
            padding: 5px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* Navigation zurück */
        .back-nav {
            max-width: 1100px;
            margin: 20px auto 10px;
            padding: 0 20px;
            display: none;
            align-items: center;
            justify-content: space-between;
        }

        .back-btn {
            background: transparent;
            border: 1px solid var(--accent-bronze);
            color: var(--text-dark);
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: var(--accent-bronze);
            color: #fff;
        }

        .active-cat-title {
            font-size: 1.4rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-bronze);
        }

        /* Admin Panel */
        #admin-panel {
            max-width: 800px;
            margin: 0 auto 40px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            padding: 30px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: var(--shadow);
            display: none;
        }

        #admin-panel h3 {
            margin-bottom: 20px;
            font-size: 1.3rem;
            color: var(--text-dark);
            border-bottom: 1px solid rgba(115, 89, 66, 0.2);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 5px;
            color: var(--accent-bronze);
            font-weight: bold;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--accent-bronze);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.9);
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--text-dark);
            outline: none;
        }

        .form-group textarea {
            resize: vertical;
            height: 80px;
        }

        .btn-primary {
            background-color: var(--accent-bronze);
            color: #fff;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            letter-spacing: 1px;
            transition: background 0.3s ease;
        }

        .btn-primary:hover {
            background-color: var(--text-dark);
        }

        .admin-product-list {
            margin-top: 30px;
        }

        .admin-product-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.5);
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid rgba(115, 89, 66, 0.1);
        }

        .admin-product-item span {
            font-size: 0.95rem;
            font-weight: bold;
        }

        .btn-danger {
            background-color: #a94442;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .btn-danger:hover {
            background-color: #843534;
        }

        /* Produkt Grid */
        #product-container {
            display: none;
        }

        .grid-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        }

        .card.special-offer-card {
            border: 2px solid var(--accent-gold-bright);
        }

        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .card-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-title {
            font-size: 1.3rem;
            margin-bottom: 8px;
            color: var(--text-dark);
        }

        .card-price {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent-bronze);
            margin-bottom: 12px;
        }

        .card.special-offer-card .card-price {
            color: #b8860b;
        }

        .card-description {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #4a3f35;
        }

        footer {
            text-align: center;
            margin-top: 50px;
            font-size: 0.85rem;
            color: var(--accent-bronze);
        }
    </style>
</head>
<body>

    <!-- 1. Stufe PIN Overlay (2026) -->
    <div id="pin-overlay">
        <div class="pin-box">
            <h2>LUXEVERA</h2>
            <p>Bitte geben Sie den PIN-Code ein</p>
            <input type="password" id="main-pin-input" placeholder="••••" maxlength="6">
            <button type="button" id="main-pin-btn">Zugriff anfordern</button>
            <div id="main-pin-error" class="pin-error">Falscher PIN-Code.</div>
        </div>
    </div>

    <!-- 2. Stufe Admin PIN Modal (8888) -->
    <div id="admin-pin-modal">
        <div class="pin-box">
            <button class="close-pin-btn" onclick="closeAdminPinModal()">×</button>
            <h2>Admin-Bereich</h2>
            <p>Admin-PIN eingeben</p>
            <input type="password" id="admin-pin-input" placeholder="••••" maxlength="6">
            <button type="button" id="admin-pin-btn">Bestätigen</button>
            <div id="admin-pin-error" class="pin-error">Falscher Admin-PIN.</div>
        </div>
    </div>

    <!-- Hauptinhalt -->
    <div id="main-content">
        <header>
            <button class="admin-toggle-btn" onclick="requestAdminAccess()">⚙️ Management</button>
            <img src="logo.png" alt="LUXEVERA Logo" class="logo-img">
        </header>

        <!-- Admin Panel -->
        <div id="admin-panel">
            <h3>Produkt-Management</h3>
            <form id="product-form" onsubmit="addProduct(event)">
                <div class="form-group">
                    <label for="p-name">Produktname</label>
                    <input type="text" id="p-name" required placeholder="z. B. Royale Jasmin Parfüm">
                </div>
                <div class="form-group">
                    <label for="p-price">Preis (€)</label>
                    <input type="text" id="p-price" required placeholder="z. B. 195,00 €">
                </div>
                <div class="form-group">
                    <label for="p-category">Kategorie</label>
                    <select id="p-category">
                        <option value="angebote">🔥 Angebote der Woche</option>
                        <option value="parfum">Parfüm</option>
                        <option value="kosmetik">Kosmetik & Make-up</option>
                        <option value="accessoires">Accessoires & Brillen</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="p-desc">Beschreibung</label>
                    <textarea id="p-desc" required placeholder="Edle Noten von..."></textarea>
                </div>
                <div class="form-group">
                    <label for="p-image">Produktbild auswählen</label>
                    <input type="file" id="p-image" accept="image/*" required>
                </div>
                <button type="submit" class="btn-primary">Produkt hinzufügen</button>
            </form>

            <div class="admin-product-list">
                <h4 style="margin-bottom: 15px; color: var(--text-dark);">Bestehende Produkte verwalten:</h4>
                <div id="admin-list-container"></div>
            </div>
        </div>

        <!-- 3. Kacheln Navigation für Kategorien -->
        <div id="category-tiles" class="category-tiles-container">
            <div class="category-tile offer-tile" onclick="openCategory('angebote', '🔥 Angebote der Woche')">
                <span class="tile-badge">Special Deal</span>
                <img src="https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?auto=format&fit=crop&w=600&q=80" alt="Angebote">
                <div class="category-tile-overlay">
                    <div class="category-tile-title">Angebote der Woche</div>
                </div>
            </div>
            <div class="category-tile" onclick="openCategory('parfum', 'Parfüm')">
                <img src="https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?auto=format&fit=crop&w=600&q=80" alt="Parfüm">
                <div class="category-tile-overlay">
                    <div class="category-tile-title">Parfüm</div>
                </div>
            </div>
            <div class="category-tile" onclick="openCategory('kosmetik', 'Kosmetik & Make-up')">
                <img src="https://images.unsplash.com/photo-1586495777744-4413f21062fa?auto=format&fit=crop&w=600&q=80" alt="Kosmetik">
                <div class="category-tile-overlay">
                    <div class="category-tile-title">Kosmetik</div>
                </div>
            </div>
            <div class="category-tile" onclick="openCategory('accessoires', 'Accessoires')">
                <img src="https://images.unsplash.com/photo-1511499767150-a48a237f0083?auto=format&fit=crop&w=600&q=80" alt="Accessoires">
                <div class="category-tile-overlay">
                    <div class="category-tile-title">Accessoires</div>
                </div>
            </div>
        </div>

        <!-- Back Navigation & Produktübersicht -->
        <div id="back-nav" class="back-nav">
            <button class="back-btn" onclick="showCategories()">← Kategorien</button>
            <div id="active-cat-title" class="active-cat-title">Kategorie</div>
        </div>

        <div id="product-container">
            <main class="grid-container" id="product-grid"></main>
        </div>

        <footer>
            <p>&copy; 2026 LUXEVERA. Alle Rechte vorbehalten.</p>
        </footer>
    </div>

    <script>
        const MAIN_PIN = "2026";
        const ADMIN_PIN = "8888";

        // Firebase Konfiguration (Hier deine Daten aus der Firebase-Konsole eintragen!)
        const firebaseConfig = {
            apiKey: "DEIN_API_KEY",
            authDomain: "DEIN_PROJEKT.firebaseapp.com",
            databaseURL: "https://DEIN_PROJEKT-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "DEIN_PROJEKT",
            storageBucket: "DEIN_PROJEKT.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        // Firebase Initialisieren (Falls Config gepflegt ist)
        let db = null;
        if (firebaseConfig.apiKey !== "DEIN_API_KEY") {
            firebase.initializeApp(firebaseConfig);
