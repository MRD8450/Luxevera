<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUXEVERA | Luxury Product Showcase</title>
    <style>
        :root {
            --bg-gradient-start: #e5d9cc;
            --bg-gradient-end: #c4b09c;
            --card-bg: rgba(255, 255, 255, 0.65);
            --text-dark: #2a211c;
            --accent-bronze: #735942;
            --accent-gold: #b39368;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
            color: var(--text-dark);
            min-height: 100vh;
            padding-bottom: 50px;
        }

        /* PIN-Schutz Overlay */
        #pin-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .pin-box {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: var(--shadow);
            text-align: center;
            max-width: 380px;
            width: 90%;
        }

        .pin-box h2 {
            font-size: 1.5rem;
            letter-spacing: 2px;
            margin-bottom: 10px;
            color: var(--text-dark);
            text-transform: uppercase;
        }

        .pin-box p {
            font-size: 0.9rem;
            color: var(--accent-bronze);
            margin-bottom: 20px;
        }

        .pin-box input {
            width: 100%;
            padding: 12px;
            font-size: 1.2rem;
            text-align: center;
            letter-spacing: 5px;
            border: 1px solid var(--accent-bronze);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.8);
            color: var(--text-dark);
            margin-bottom: 15px;
            outline: none;
        }

        .pin-box button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-bronze);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .pin-box button:hover {
            background-color: var(--text-dark);
        }

        .pin-error {
            color: #a94442;
            font-size: 0.85rem;
            margin-top: 10px;
            display: none;
        }

        /* Hauptinhalt */
        #main-content {
            display: none;
        }

        header {
            text-align: center;
            padding: 40px 20px 20px;
        }

        .logo-img {
            max-width: 420px;
            width: 100%;
            height: auto;
            margin-bottom: 10px;
        }

        .category-filter {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: transparent;
            border: 1px solid var(--accent-bronze);
            padding: 8px 22px;
            font-family: inherit;
            font-size: 0.9rem;
            letter-spacing: 1px;
            color: var(--text-dark);
            cursor: pointer;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        .filter-btn:hover, .filter-btn.active {
            background-color: var(--accent-bronze);
            color: #ffffff;
        }

        .grid-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        }

        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .card-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-title {
            font-size: 1.3rem;
            margin-bottom: 8px;
            color: var(--text-dark);
        }

        .card-price {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent-bronze);
            margin-bottom: 12px;
        }

        .card-description {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #4a3f35;
        }

        .loading-text {
            grid-column: 1 / -1;
            text-align: center;
            font-size: 1.1rem;
            color: var(--accent-bronze);
            padding: 40px;
        }

        footer {
            text-align: center;
            margin-top: 50px;
            font-size: 0.85rem;
            color: var(--accent-bronze);
        }
    </style>
</head>
<body>

    <!-- PIN Abfrage Overlay -->
    <div id="pin-overlay">
        <div class="pin-box">
            <h2>LUXEVERA</h2>
            <p>Bitte geben Sie den PIN-Code ein</p>
            <input type="password" id="pin-input" placeholder="••••" maxlength="6">
            <button onclick="checkPin()">Zugriff anfordern</button>
            <div id="pin-error" class="pin-error">Falscher PIN-Code. Bitte versuchen Sie es erneut.</div>
        </div>
    </div>

    <!-- Eigentlicher Website-Inhalt -->
    <div id="main-content">
        <header>
            <img src="logo.png" alt="LUXEVERA Logo" class="logo-img">
        </header>

        <div class="category-filter">
            <button class="filter-btn active" onclick="filterCategory('all', event)">Alle</button>
            <button class="filter-btn" onclick="filterCategory('parfum', event)">Parfüm</button>
            <button class="filter-btn" onclick="filterCategory('makeup', event)">Make-up</button>
            <button class="filter-btn" onclick="filterCategory('brillen', event)">Brillen</button>
        </div>

        <main class="grid-container" id="product-grid">
            <div class="loading-text">Produkte werden geladen...</div>
        </main>

        <footer>
            <p>&copy; 2026 LUXEVERA. Alle Rechte vorbehalten.</p>
        </footer>
    </div>

    <script>
        const CORRECT_PIN = "2026";
        
        // Veröffentlichter CSV-Link von Google Sheets
        const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQFEveKHZRGRXqcwTCIQtmbgTbSbW1rMWVnC8dWUew1KOWuxyIwWAPxAnD0ROwbn8x6-y2X4_FMeTOh/pub?output=csv";

        function checkPin() {
            const enteredPin = document.getElementById('pin-input').value;
            const errorMsg = document.getElementById('pin-error');

            if (enteredPin === CORRECT_PIN) {
                document.getElementById('pin-overlay').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                loadProductsFromSheet();
            } else {
                errorMsg.style.display = 'block';
                document.getElementById('pin-input').value = '';
            }
        }

        document.getElementById('pin-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkPin();
            }
        });

        async function loadProductsFromSheet() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '<div class="loading-text">Produkte werden aus Google Sheets geladen...</div>';

            try {
                // Nutzung von AllOrigins Proxy um Browser CORS-Sperren auf GitHub Pages zu umgehen
                const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(SHEET_CSV_URL)}`;
                const response = await fetch(proxyUrl);
                if (!response.ok) throw new Error("Fehler beim Abruf der Daten");
                
                const text = await response.text();
                const lines = text.trim().split('\n');

                const products = [];
                for (let i = 1; i < lines.length; i++) {
                    if (!lines[i].trim()) continue;
                    
                    // Regex zum korrekten Trennen von CSV mit Kommas in Anführungszeichen
                    const r = lines[i].match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || lines[i].split(',');
                    const clean = r.map(val => val.replace(/^"|"$/g, '').trim());

                    if (clean.length >= 4 && clean[0]) {
                        products.push({
                            name: clean[0],
                            price: clean[1],
                            description: clean[2],
                            category: (clean[3] || 'all').toLowerCase(),
                            image: clean[4] || 'https://via.placeholder.com/600x400?text=LUXEVERA'
                        });
                    }
                }

                if (products.length === 0) {
                    grid.innerHTML = '<div class="loading-text">Keine Produkte in der Google-Tabelle gefunden.</div>';
                    return;
                }

                grid.innerHTML = ''; 

                products.forEach(product => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.setAttribute('data-category', product.category);

                    card.innerHTML = `
                        <img src="${product.image}" alt="${product.name}" onerror="this.src='https://via.placeholder.com/600x400?text=LUXEVERA'">
                        <div class="card-body">
                            <h2 class="card-title">${product.name}</h2>
                            <div class="card-price">${product.price}</div>
                            <p class="card-description">${product.description}</p>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) {
                console.error("Fehler beim Laden:", error);
                grid.innerHTML = '<div class="loading-text">Fehler beim Laden der Produktdaten aus Google Sheets.</div>';
            }
        }

        function filterCategory(category, event) {
            const cards = document.querySelectorAll('.card');
            const buttons = document.querySelectorAll('.filter-btn');

            buttons.forEach(btn => btn.classList.remove('active'));
            if(event) {
                event.target.classList.add('active');
            }

            cards.forEach(card => {
                if (category === 'all' || card.getAttribute('data-category') === category) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
