<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUXEVERA | Luxury Product Showcase</title>
    <style>
        :root {
            --bg-gradient-start: #e5d9cc;
            --bg-gradient-end: #c4b09c;
            --card-bg: rgba(255, 255, 255, 0.75);
            --text-dark: #2a211c;
            --accent-bronze: #735942;
            --accent-gold: #b39368;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
            color: var(--text-dark);
            min-height: 100vh;
            padding-bottom: 50px;
        }

        /* PIN-Schutz Overlay */
        #pin-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .pin-box {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: var(--shadow);
            text-align: center;
            max-width: 380px;
            width: 90%;
        }

        .pin-box h2 {
            font-size: 1.5rem;
            letter-spacing: 2px;
            margin-bottom: 10px;
            color: var(--text-dark);
            text-transform: uppercase;
        }

        .pin-box p {
            font-size: 0.9rem;
            color: var(--accent-bronze);
            margin-bottom: 20px;
        }

        .pin-box input {
            width: 100%;
            padding: 12px;
            font-size: 1.2rem;
            text-align: center;
            letter-spacing: 5px;
            border: 1px solid var(--accent-bronze);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.9);
            color: var(--text-dark);
            margin-bottom: 15px;
            outline: none;
        }

        .pin-box button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-bronze);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .pin-box button:hover {
            background-color: var(--text-dark);
        }

        .pin-error {
            color: #a94442;
            font-size: 0.85rem;
            margin-top: 10px;
            display: none;
        }

        /* Hauptinhalt */
        #main-content {
            display: none;
        }

        header {
            text-align: center;
            padding: 40px 20px 20px;
            position: relative;
        }

        .logo-img {
            max-width: 420px;
            width: 100%;
            height: auto;
            margin-bottom: 10px;
        }

        /* Admin Button */
        .admin-toggle-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: transparent;
            border: 1px solid var(--accent-bronze);
            color: var(--text-dark);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .admin-toggle-btn:hover {
            background: var(--accent-bronze);
            color: #fff;
        }

        .category-filter {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0 30px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: transparent;
            border: 1px solid var(--accent-bronze);
            padding: 8px 22px;
            font-family: inherit;
            font-size: 0.9rem;
            letter-spacing: 1px;
            color: var(--text-dark);
            cursor: pointer;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        .filter-btn:hover, .filter-btn.active {
            background-color: var(--accent-bronze);
            color: #ffffff;
        }

        /* Admin Panel Modal */
        #admin-panel {
            max-width: 800px;
            margin: 0 auto 40px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            padding: 30px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: var(--shadow);
            display: none;
        }

        #admin-panel h3 {
            margin-bottom: 20px;
            font-size: 1.3rem;
            color: var(--text-dark);
            border-bottom: 1px solid rgba(115, 89, 66, 0.2);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 5px;
            color: var(--accent-bronze);
            font-weight: bold;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--accent-bronze);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.9);
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--text-dark);
            outline: none;
        }

        .form-group textarea {
            resize: vertical;
            height: 80px;
        }

        .btn-primary {
            background-color: var(--accent-bronze);
            color: #fff;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            letter-spacing: 1px;
            transition: background 0.3s ease;
        }

        .btn-primary:hover {
            background-color: var(--text-dark);
        }

        .admin-product-list {
            margin-top: 30px;
        }

        .admin-product-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.5);
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid rgba(115, 89, 66, 0.1);
        }

        .admin-product-item span {
            font-size: 0.95rem;
            font-weight: bold;
        }

        .btn-danger {
            background-color: #a94442;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .btn-danger:hover {
            background-color: #843534;
        }

        /* Produkt Grid */
        .grid-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        }

        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .card-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-title {
            font-size: 1.3rem;
            margin-bottom: 8px;
            color: var(--text-dark);
        }

        .card-price {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent-bronze);
            margin-bottom: 12px;
        }

        .card-description {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #4a3f35;
        }

        footer {
            text-align: center;
            margin-top: 50px;
            font-size: 0.85rem;
            color: var(--accent-bronze);
        }
    </style>
</head>
<body>

    <!-- PIN Abfrage Overlay -->
    <div id="pin-overlay">
        <div class="pin-box">
            <h2>LUXEVERA</h2>
            <p>Bitte geben Sie den PIN-Code ein</p>
            <input type="password" id="pin-input" placeholder="••••" maxlength="6">
            <button onclick="checkPin()">Zugriff anfordern</button>
            <div id="pin-error" class="pin-error">Falscher PIN-Code. Bitte versuchen Sie es erneut.</div>
        </div>
    </div>

    <!-- Eigentlicher Website-Inhalt -->
    <div id="main-content">
        <header>
            <button class="admin-toggle-btn" onclick="toggleAdminPanel()">⚙️ Management</button>
            <img src="logo.png" alt="LUXEVERA Logo" class="logo-img">
        </header>

        <!-- Admin / Management Formular (Backend für den Kollegen) -->
        <div id="admin-panel">
            <h3>Produkt-Management</h3>
            <form id="product-form" onsubmit="addProduct(event)">
                <div class="form-group">
                    <label for="p-name">Produktname</label>
                    <input type="text" id="p-name" required placeholder="z. B. Royale Jasmin Parfüm">
                </div>
                <div class="form-group">
                    <label for="p-price">Preis (€)</label>
                    <input type="text" id="p-price" required placeholder="z. B. 195,00 €">
                </div>
                <div class="form-group">
                    <label for="p-category">Kategorie</label>
                    <select id="p-category">
                        <option value="parfum">Parfüm</option>
                        <option value="makeup">Make-up</option>
                        <option value="brillen">Brillen</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="p-desc">Beschreibung</label>
                    <textarea id="p-desc" required placeholder="Edle Noten von..."></textarea>
                </div>
                <div class="form-group">
                    <label for="p-image">Produktbild vom Handy/PC auswählen</label>
                    <input type="file" id="p-image" accept="image/*" required>
                </div>
                <button type="submit" class="btn-primary">Produkt hinzufügen</button>
            </form>

            <div class="admin-product-list">
                <h4 style="margin-bottom: 15px; color: var(--text-dark);">Bestehende Produkte verwalten:</h4>
                <div id="admin-list-container">
                    <!-- Dynamische Liste zum Löschen -->
                </div>
            </div>
        </div>

        <div class="category-filter">
            <button class="filter-btn active" onclick="filterCategory('all', event)">Alle</button
